name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1" # The tree-sitter parser (D-40) is C, and -race needs cgo too.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Static analysis
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Includes the end-to-end test, which runs the real binary in a real PTY or
      # ConPTY, and the C parser test.
      - run: go test -race -count=1 -timeout 10m ./...
      - name: Fuzz the text buffer
        if: runner.os == 'Linux'
        run: go test -run=NONE -fuzz=FuzzEdits -fuzztime=30s ./internal/buffer
      - name: Fuzz the terminal emulator
        if: runner.os == 'Linux'
        run: go test -run=NONE -fuzz=FuzzEmulatorOutput -fuzztime=30s ./internal/term
      - name: Build
        shell: bash
        run: go build -o "dist/lazycode${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/lazycode
      # For trying the prototype by hand in real terminals (M0-03, M0-06, M0-07).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lazycode-${{ runner.os }}
          path: dist/
          retention-days: 14
      # M0-06: open the app icon as the system would. The folder has a space on
      # purpose, as real install paths can.
      - name: App icon, Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm libglib2.0-bin desktop-file-utils
          mkdir -p "$RUNNER_TEMP/la zy"
          cp dist/lazycode "$RUNNER_TEMP/la zy/lazycode"
          xvfb-run -a sh scripts/test-icon.sh "$RUNNER_TEMP/la zy/lazycode"
      - name: App icon, macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/la zy"
          cp dist/lazycode "$RUNNER_TEMP/la zy/lazycode"
          sh scripts/test-icon.sh "$RUNNER_TEMP/la zy/lazycode"
      - name: App icon, Windows
        if: runner.os == 'Windows'
        run: |
          $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\la zy"
          Copy-Item dist\lazycode.exe $dir
          .\scripts\test-icon.ps1 -Bin "$dir\lazycode.exe"
      # REL-2: the install scripts, against a fake release served from the runner.
      - name: Installer, Linux and macOS
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: Installer, Windows
        if: runner.os == 'Windows'
        run: .\scripts\test-install.ps1

  # M0-07: real terminals with simulated key presses. Kitty runs on a virtual display,
  # and must pass. The other two depend on what the runners allow, so they only report:
  # a failure there means keytest has to be run by hand.
  keys:
    name: keys ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Kitty
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb kitty xdotool x11-xkb-utils libgl1-mesa-dri
          go build -o "$RUNNER_TEMP/keytest" ./cmd/keytest
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" sh scripts/keytest-kitty.sh "$RUNNER_TEMP/keytest"
      - name: macOS Terminal
        if: runner.os == 'macOS'
        run: |
          go build -o "$RUNNER_TEMP/keytest" ./cmd/keytest
          sh scripts/keytest-macos.sh "$RUNNER_TEMP/keytest"
      - name: Windows Terminal
        if: runner.os == 'Windows'
        run: |
          go build -o "$env:RUNNER_TEMP\keytest.exe" .\cmd\keytest
          .\scripts\keytest-windows.ps1 -Bin "$env:RUNNER_TEMP\keytest.exe"
