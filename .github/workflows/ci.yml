name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1" # The tree-sitter parser (D-40) is C, and -race needs cgo too.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Static analysis
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Includes the end-to-end test, which runs the real binary in a real PTY or
      # ConPTY, and the C parser test.
      - run: go test -race -count=1 -timeout 10m ./...
      - name: Build
        shell: bash
        run: go build -o "dist/lazycode${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/lazycode
      # For trying the prototype by hand in real terminals (M0-03, M0-06, M0-07).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lazycode-${{ runner.os }}
          path: dist/
          retention-days: 14
